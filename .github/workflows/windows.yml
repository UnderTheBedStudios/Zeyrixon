name: Windows build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      # Run the python script here so the generated resources exist on this machine
      # Note: Windows runners use 'python', not 'python3'
      - name: Run a tool
        run: python tools/EmbedResources.py

      - name: Generate project files
        run: .\vendor\binary\premake5.exe vs2022

      - name: Build
        run: msbuild Zeyrixon.sln /m /p:Configuration=Dist /p:Platform=x64
